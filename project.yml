name: TimeTracker

options:
  bundleIdPrefix: dev.andreas          # placeholder, change freely
  deploymentTarget: { macOS: "14.0" }
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    # Ad-hoc signing so `xcodebuild` works without an Apple Developer team.
    # Pick a real Team in Xcode's Signing & Capabilities when you want one.
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES

packages:
  TimeTrackerCore:
    path: Packages/TimeTrackerCore

targets:
  TimeTracker:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: TimeTrackerCore
      # The CLI ships inside the app. Helpers/, not MacOS/: `timetracker` and
      # `TimeTracker` cannot share a folder on a case-insensitive volume.
      - target: TimeTrackerCLITool
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: App/Info.plist
      properties:
        # LSUIElement makes this an "agent" app: menu bar only, no Dock icon.
        LSUIElement: true
        NSPrincipalClass: NSApplication
        CFBundleName: TimeTracker
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"

  # Named apart from its `timetracker` product: Xcode's per-target build
  # folders would otherwise collide with TimeTracker's on a case-insensitive disk.
  TimeTrackerCLITool:
    type: tool
    platform: macOS
    settings:
      PRODUCT_NAME: timetracker
      PRODUCT_MODULE_NAME: TimeTrackerCLITool
      PRODUCT_BUNDLE_IDENTIFIER: dev.andreas.TimeTracker.cli
    sources: [Packages/TimeTrackerCore/Sources/timetracker]
    dependencies:
      - package: TimeTrackerCore
        product: TimeTrackerCLI

schemes:
  TimeTracker:
    build:
      targets:
        TimeTracker: all
    run:
      config: Debug
